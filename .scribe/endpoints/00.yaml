    custom: []
    httpMethods:
      - GET
    uri: 'api/firmware/{firmware_id}/download'
    metadata:
      custom: []
      groupName: Firmware
      groupDescription: |-

        Gestión y descarga de archivos de firmware para los instrumentos.
      subgroup: ''
      subgroupDescription: ''
      title: 'Descargar firmware'
      description: 'Inicia la descarga del archivo binario (.bin) asociado a un firmware específico.'
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
