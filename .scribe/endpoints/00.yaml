      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      instrument:
        custom: []
        name: instrument
        description: 'El nombre del instrumento (ej. IO-8).'
        required: false
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanQueryParameters:
      instrument: architecto
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
          "instrument": "IO-8",
          "firmware": {
          "stable": { "id": 1, "version": "1.0.0", "description": "Lanzamiento estable", "size": "1.2 MB", "created_at": "2026-06-06" },
          "nightly": { "id": 2, "version": "1.1.0-beta", "description": "Versión en pruebas", "size": "1.2 MB", "created_at": "2026-06-07" }
          }
          }
        headers: []
        description: ''
      -
        custom: []
        status: 200
        content: |-
          {
          "instruments": ["IO-8", "IO-12"]
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
